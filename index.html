<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QBspeaker</title><style>body{font-family:system-ui;background:#0b1020;color:#f8fafc;margin:0}main{max-width:1100px;margin:auto;padding:18px}section{background:#151d31;border:1px solid #334155;border-radius:14px;padding:18px;margin-bottom:14px}button,select,input{font:inherit;padding:10px;border-radius:8px;border:1px solid #475569;background:#0b1222;color:white}button{cursor:pointer;background:#26344d;font-weight:700}.row{display:flex;gap:8px;flex-wrap:wrap}.question{font-size:25px;line-height:1.6;min-height:220px}.answer{border-top:1px solid #475569;margin-top:15px;padding-top:15px}.muted{color:#aab6cc}.good{background:#166534}.bad{background:#991b1b}.hidden{display:none}</style></head><body><main><section><h1>QBspeaker</h1><div class="muted" id="status">Loading tossups…</div><div class="row"><select id="cat"><option value="">All categories</option></select><select id="diff"><option value="">All difficulties</option></select><button id="new">New tossup</button></div></section><section><div id="meta" class="muted"></div><div id="q" class="question"></div><div class="row"><button id="read">▶ Read</button><button id="pause">Ⅱ Pause</button><button id="buzz">Space: Buzz</button><button id="skip">N: Skip</button></div><div class="answer"><b>Your answer</b><div class="row"><input id="guess" placeholder="Type answer"><button id="reveal">Reveal</button></div><div id="official" class="hidden"></div><div class="row"><button id="correct" class="good">Correct +10</button><button id="power" class="good">Power +15</button><button id="wrong" class="bad">Wrong −5</button><button id="zero">Last line 0</button></div><div id="result" class="muted"></div><h2>Score: <span id="score">0</span></h2></div></section></main><script>
let all=[],cur=null,score=0,words=[],pos=0,speaking=false,utter=null;const $=id=>document.getElementById(id);function clean(s){let d=document.createElement('div');d.innerHTML=s||'';return d.textContent||''}function choose(){let c=$('cat').value,d=$('diff').value,a=all.filter(x=>(!c||x.category===c)&&(!d||String(x.difficulty)===d));if(!a.length)return;cur=a[Math.floor(Math.random()*a.length)];$('q').innerHTML=cur.question;$('meta').textContent=(cur.category||'')+' · '+(cur.subcategory||'')+' · difficulty '+cur.difficulty;$('official').classList.add('hidden');$('result').textContent='';words=clean(cur.question).trim().split(/\s+/);pos=0;stop()}function stop(){speechSynthesis.cancel();speaking=false}function read(){stop();let text=clean(cur.question);utter=new SpeechSynthesisUtterance(text);utter.rate=1;utter.onend=()=>speaking=false;speaking=true;speechSynthesis.speak(utter)}async function load(){try{const names=['questions-1.json.gz','questions-2.json.gz','questions-3.json.gz'];const parts=await Promise.all(names.map(async name=>{const b=await fetch(name).then(r=>r.arrayBuffer());const t=await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text();return JSON.parse(t)}));all=parts.flat();let cats=[...new Set(all.map(x=>x.category).filter(Boolean))].sort(),ds=[...new Set(all.map(x=>x.difficulty))].sort((a,b)=>a-b);for(let x of cats)$('cat').insertAdjacentHTML('beforeend',`<option>${x}</option>`);for(let x of ds)$('diff').insertAdjacentHTML('beforeend',`<option>${x}</option>`);$('status').textContent=all.length.toLocaleString()+' tossups loaded';choose()}catch(e){$('status').textContent='Could not load questions: '+e}}$('new').onclick=choose;$('read').onclick=read;$('pause').onclick=()=>stop();$('buzz').onclick=()=>stop();$('skip').onclick=choose;$('reveal').onclick=()=>{$('official').classList.remove('hidden');$('official').innerHTML='<b>Answer:</b> '+cur.answer};$('correct').onclick=()=>{$('result').textContent='Correct! +10';score+=10;$('score').textContent=score};$('power').onclick=()=>{$('result').textContent='Power! +15';score+=15;$('score').textContent=score};$('wrong').onclick=()=>{$('result').textContent='Incorrect −5';score-=5;$('score').textContent=score};$('zero').onclick=()=>{$('result').textContent='Last line: 0'};document.onkeydown=e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;if(e.code==='Space'){e.preventDefault();stop()}if(e.key.toLowerCase()==='n')choose()};load();</script></body></html>
