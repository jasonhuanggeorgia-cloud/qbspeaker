<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quizbowl Speaker</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#151d31;--line:#334155;--txt:#f8fafc;--muted:#aab6cc;--accent:#60a5fa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.5 system-ui}main{max-width:1300px;margin:auto;padding:18px;display:grid;grid-template-columns:320px 1fr;gap:18px}aside,section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}h1{margin:0 0 4px;font-size:25px}h2{margin:0 0 8px}.muted{color:var(--muted);font-size:13px}label{display:block;margin:13px 0 6px;font-weight:700}input,button,select{font:inherit}input[type=text],input[type=number],select{width:100%;padding:9px;border-radius:8px;border:1px solid var(--line);background:#0b1222;color:var(--txt)}button{padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#26344d;color:var(--txt);font-weight:700;cursor:pointer}button:hover{border-color:var(--accent)}button:disabled{opacity:.4}.checks{max-height:230px;overflow:auto;border:1px solid var(--line);padding:9px;border-radius:8px}.checks label{font-weight:400;margin:3px 0;display:flex;gap:8px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.question{font-size:25px;line-height:1.65;min-height:210px;max-height:500px;overflow:auto;padding:10px;border:1px solid var(--line);border-radius:8px}.word.active{background:#b45309;border-radius:4px;padding:0 2px}.answer{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}.answerrow{display:flex;gap:8px}.answerrow input{flex:1}.hidden{display:none}.score{font-size:22px;font-weight:800;margin:8px 0}.good{background:#14532d}.bad{background:#7f1d1d}.power-flash{position:relative;overflow:visible}.power-star{position:absolute;color:#facc15;font-size:clamp(15px,2.2vw,23px);pointer-events:none;z-index:5;animation:powerStarFloat .72s ease-out forwards;transform-origin:center}.reveal-power-star{position:absolute;right:2px;top:-9px;color:#facc15;font-size:23px;pointer-events:none;z-index:6;opacity:1!important;animation:none!important;transform:none!important}.power-label-transition{animation:labelFade .24s ease-out}@keyframes powerStarFloat{0%{opacity:0;transform:translate(0,5px) rotate(-10deg) scale(.65)}18%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-12px) rotate(18deg) scale(1)}}@keyframes slowSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}@keyframes labelFade{0%{opacity:.25;transform:translateY(2px)}100%{opacity:1;transform:translateY(0)}}@keyframes powerStars{0%{opacity:0;transform:rotate(-7deg) scale(.72)}12%{opacity:1}28%{opacity:1;transform:rotate(-2deg) scale(1)}100%{opacity:0;transform:rotate(7deg) scale(1.18)}}.lastline-flash{background:#6b7280!important;color:#fff!important;animation:none!important}@media(max-width:850px){main{grid-template-columns:1fr;padding:10px}.question{font-size:21px}}
.watermark{text-align:center;padding:8px 12px 2px;color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.75;pointer-events:none;user-select:none}
.style-reading{white-space:pre-wrap}
</style>
<div class="watermark" aria-label="Created by Jason Huang">Created by Jason Huang</div><main><aside><h1>Quizbowl Speaker</h1><div class=muted>Tossups · speech · filters · scoring</div>
<label>Search</label><input id=search type=text placeholder="optional keyword">
<label>Categories</label><div id=cats class=checks>Loading categories…</div><div class=row><button id=allc>All</button><button id=nonec>None</button></div>
<label>Difficulties</label><div id=diffs class=checks>Loading difficulties…</div><div class=row><button id=alld>All</button><button id=noned>None</button></div>
<details open><summary><b>Settings</b></summary>
<label>Voice</label><select id=voice></select>
<label>Speaking speed (WPM)</label><input id=wpm type=number min=80 max=400 step=5 value=240>
<label>Pitch</label><input id=pitch type=number min=.5 max=2 step=.1 value=1>
<label><input id=autotimer type=checkbox checked> Auto-reveal timer after buzzing</label><label><input id=qbstyle type=checkbox> QB Reader Style Reading</label>
<label><input id="tournament" type="checkbox"> Tournament mode</label><label><input id="powerOnly" type="checkbox"> Power marks only</label>
<label>Timer duration (seconds)</label><input id=seconds type=number min=3 max=60 step=1 value=10>
</details>
<div class=row><button id=new>New tossup</button><button id=reset>Reset</button></div><div id=meta class=muted></div></aside>
<section><h2 id=head>Ready</h2><div id=status class=muted>New tossup loads a question. Space buzzes. P pauses. N skips.</div>
<div id=countdown class="score" aria-live="polite"></div><div id=q class=question></div><div id=powerNotice class="muted" style="margin-top:8px;font-weight:800"></div>
<div class=row><button id=start>▶ Read</button><button id=pause>Ⅱ Pause</button><button id=buzz>Space: Buzz</button><button id=skip>N: Skip</button></div>
<div class=answer><b>Your answer</b><div id=answerrow class="answerrow hidden"><input id=ans placeholder="Type answer after buzzing"><button id=check>Reveal</button></div><div id=official class="muted hidden"></div><div class=row><button id=correct class=good disabled>Correct</button><button id=wrong class=bad disabled>Incorrect</button></div><div id=result class=muted></div><div class=score>Score: <span id=score>0</span></div></div></section></main>
<script>
const $=x=>document.getElementById(x);let cur,words=[],i=0,timer=null,paused=true,buzzed=false,score=0,voices=[],countTimer=null,speechResumeWord=0,speechPaused=false,qbStyleShown=0,hasPower=false,powerWordIndex=-1,lastLineStart=0,powerBuzzed=false,lastLineBuzzed=false;
function checked(id){return [...$(id).querySelectorAll('input:checked')].map(x=>x.value)}
let allQuestions=[];let dataReady=null;
async function loadData(){if(dataReady)return dataReady;dataReady=(async()=>{const names=['questions-1.json.gz','questions-2.json.gz','questions-3.json.gz'];const parts=await Promise.all(names.map(async name=>{const r=await fetch(name);if(!r.ok)throw Error('Could not load '+name);const b=await r.arrayBuffer();const text=await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text();return JSON.parse(text)}));allQuestions=parts.flat();return allQuestions})();return dataReady}
async function api(path,params={}){await loadData();if(path==='/api/meta'){return {categories:[...new Set(allQuestions.map(x=>x.category).filter(Boolean))].sort(),difficulties:[...new Set(allQuestions.map(x=>String(typeof x.difficulty==='object'?x.difficulty.$numberInt:x.difficulty)).filter(Boolean))].sort((a,b)=>+a-+b),count:allQuestions.length}}if(path==='/api/question'){let rows=allQuestions.slice();if(params.category?.length)rows=rows.filter(x=>params.category.includes(x.category));if(params.difficulty?.length)rows=rows.filter(x=>params.difficulty.includes(String(typeof x.difficulty==='object'?x.difficulty.$numberInt:x.difficulty)));if(params.powerOnly)rows=rows.filter(x=>/\(\s*\*\s*\)/.test(clean(x.question||'')));const s=(params.search||'').trim().toLowerCase();if(s)rows=rows.filter(x=>String(x.question||'').toLowerCase().includes(s)||String(x.answer||'').toLowerCase().includes(s));if(!rows.length)return {error:'No tossups match the selected filters.'};return rows[Math.floor(Math.random()*rows.length)]}return {error:'Not found'}}
function render(id,vals){$(id).innerHTML=vals.map(v=>`<label><input type=checkbox value="${String(v).replaceAll('"','&quot;')}"> ${v}</label>`).join('');$(id).querySelectorAll('input').forEach(x=>x.checked=true)}
function clean(s){let d=document.createElement('div');d.innerHTML=s||'';return d.textContent||''}
function stop(){
 if(timer)clearInterval(timer);
 timer=null;
 if(countTimer)clearInterval(countTimer);
 countTimer=null;
 $('countdown').textContent='';
 paused=true;
 speechPaused=false;
 $('pause').textContent='Ⅱ Pause';
 if('speechSynthesis' in window)window.speechSynthesis.cancel();
}
function pauseResume(){
 if(!cur||buzzed||!('speechSynthesis' in window))return;
 if(!paused){
   speechPaused=true; paused=true;
   window.speechSynthesis.cancel();
   if(timer)clearInterval(timer); timer=null;
   $('pause').textContent='▶ Resume'; $('status').textContent='Paused.';
 }else{
   paused=false; speechPaused=false; $('pause').textContent='Ⅱ Pause';
   speakFrom(Math.max(0,i+1)); $('status').textContent='Reading resumed.';
 }
}
function show(text){
 const raw=String(text||''); const plain=clean(raw);
 words=plain.trim().split(/\s+/).filter(Boolean); i=0; powerBuzzed=false; lastLineBuzzed=false;
 powerWordIndex=words.findIndex(w=>/^\(\s*\*\s*\)$/.test(w.replace(/[.,;:!?]+$/,''))); hasPower=powerWordIndex>=0;
 const starts=[]; let pos=0; words.forEach((w,n)=>{starts.push(pos);pos+=w.length+1});
 const sentenceStarts=[]; for(let n=0;n<words.length;n++){if(n===0||/[.!?][\"”’']?$/.test(words[n-1]))sentenceStarts.push(n)}
 lastLineStart=sentenceStarts.length?sentenceStarts[sentenceStarts.length-1]:Math.max(0,words.length-10);
 if($('powerNotice')) $('powerNotice').textContent=hasPower?'Power in this question':'No power marked in this question';
 if($('qbstyle')&&$('qbstyle').checked){
  $('q').className='question style-reading';
  $('q').textContent='';
 }else{
  $('q').className='question';
  $('q').innerHTML=words.map((w,n)=>`<span class=word data-i=${n}>${w} </span>`).join('');
 }
}
function showProgress(n){
  if(!words.length) return;
  n=Math.max(0,Math.min(words.length-1,n));
  $('q').textContent=words.slice(0,n+1).join(' ');
}
function tick(){
 document.querySelectorAll('.active').forEach(x=>x.classList.remove('active'));
 let e=document.querySelector(`[data-i="${i}"]`);
 if(e){e.classList.add('active');if(!$('qbstyle')||!$('qbstyle').checked)e.scrollIntoView({block:'center',behavior:'auto'})}
}
function startHighlight(wpm){
 // Fallback only: the speech engine's boundary events are the primary clock.
 let ms=60000/wpm;
 if(timer)clearInterval(timer);
 timer=setTimeout(()=>{if(!speechBoundarySeen&&!buzzed)fallbackHighlight(wpm)},900);
 tick();
}
let speechBoundarySeen=false;
let lastBoundary=-1;
let lastSpokenWord=-1;
function fallbackHighlight(wpm){
 let ms=60000/wpm;
 if(timer)clearInterval(timer);
 timer=setInterval(()=>{if(i>=words.length){clearInterval(timer);timer=null;return}tick();i++},ms);
 tick();i++;
}
function speakFrom(startWord){
 if(!cur||buzzed)return;
 let wpm=Math.max(80,Math.min(400,parseInt($('wpm').value,10)||240));
 let pitch=Math.max(.5,Math.min(2,+$('pitch').value||1));
 let text=words.slice(startWord).join(' '); if(!text)return;
 let u=new SpeechSynthesisUtterance(text),v=voices[Number($('voice').value)];
 if(v)u.voice=v;u.lang=v?v.lang:'en-US';u.rate=Math.max(.5,Math.min(2,wpm/240));u.pitch=pitch;u.volume=1;
 u.onboundary=e=>{let n=startWord+(String(text).slice(0,e.charIndex||0).trim().split(/\s+/).filter(Boolean).length);i=Math.min(words.length-1,n);if($('qbstyle')&&$('qbstyle').checked)showProgress(i);else if(!($('tournament')&&$('tournament').checked))tick()};
 u.onend=()=>{if(!buzzed){i=words.length-1;if($('qbstyle')&&$('qbstyle').checked)showProgress(i);else if(!($('tournament')&&$('tournament').checked))tick();paused=true;speechPaused=false;$('pause').textContent='Ⅱ Pause';}};
 window.speechSynthesis.cancel();window.speechSynthesis.speak(u);
}
function read(){if(!cur||buzzed)return;stop();paused=false;speechPaused=false;$('pause').textContent='Ⅱ Pause';speakFrom(0)}
function buzz(){
 if(!cur||buzzed)return;
 buzzed=true;stop();
 const heard=words.slice(0,i+1).join(' ');
 powerBuzzed=hasPower && powerWordIndex>=0 && i < powerWordIndex;
 lastLineBuzzed=i>=lastLineStart;
 if($('tournament') && $('tournament').checked){ $('status').textContent=powerBuzzed?'Tournament buzz: BEFORE power':(hasPower?'Tournament buzz: AFTER power':'Tournament buzz: no power in question'); } else { $('status').textContent='Buzzed. Enter your answer and reveal.'; }
 $('buzz').disabled=true;$('answerrow').classList.remove('hidden');$('ans').focus();
 if($('autotimer').checked){
  let left=Math.max(3,Math.min(60,parseInt($('seconds').value,10)||10));
  $('countdown').textContent='Time left: '+left+'s';
  countTimer=setInterval(()=>{
   left--;
   $('countdown').textContent='Time left: '+left+'s';
   if(left<=0){clearInterval(countTimer);countTimer=null;$('countdown').textContent='Time expired';reveal()}
  },1000);
 }
}
function reveal(){
 if(countTimer)clearInterval(countTimer);
 countTimer=null;
 $('countdown').textContent='';
 $('official').textContent='Official answer: '+clean(cur.answer);
 $('official').classList.remove('hidden');
 ['correct','wrong'].forEach(x=>{let b=$(x);b.disabled=false;b.classList.remove('lastline-flash','power-label-transition');b.querySelectorAll('.reveal-power-star,.reveal-lastline').forEach(s=>s.remove())});
 if($('correct').querySelector('.reveal-power-star'))$('correct').querySelector('.reveal-power-star').remove();
 if($('wrong').querySelector('.reveal-lastline'))$('wrong').querySelector('.reveal-lastline').remove();
 if(powerBuzzed){
   $('correct').textContent='Correct (Power)';
   $('correct').classList.add('power-label-transition');
   let star=document.createElement('span');star.className='reveal-power-star';star.textContent='✦';$('correct').appendChild(star);
 }else{$('correct').textContent='Correct'}
 if(lastLineBuzzed){
   $('wrong').textContent='Incorrect (Last line)';
   $('wrong').classList.add('lastline-flash');
 }else{$('wrong').textContent='Incorrect'}
 $('status').textContent='Answer revealed.'+(($('tournament')&&$('tournament').checked)?(powerBuzzed?' Power was passed.':(lastLineBuzzed?' Last line.':' Power was not passed.')):'');
}
async function load(){stop();$('answerrow').classList.add('hidden');buzzed=false;powerBuzzed=false;lastLineBuzzed=false;$('ans').value='';$('buzz').disabled=false;$('official').classList.add('hidden');$('result').textContent='';['correct','wrong'].forEach(x=>{let b=$(x);b.disabled=true;b.classList.remove('lastline-flash','power-label-transition');b.textContent=x==='correct'?'Correct':'Incorrect';b.querySelectorAll('.reveal-power-star,.reveal-lastline,.power-star').forEach(s=>s.remove())});$('head').textContent='Loading…';let r=await api('/api/question',{category:checked('cats'),difficulty:checked('diffs'),search:$('search').value,powerOnly:$('powerOnly')&&$('powerOnly').checked});if(r.error){$('head').textContent='No tossup';$('q').textContent=r.error;return}cur=r;$('head').textContent=`${r.category} · Difficulty ${typeof r.difficulty==='object'?r.difficulty.$numberInt:r.difficulty}`;show(r.question);$('status').textContent='Read aloud, or press Space to buzz.'}
function mark(n,label){document.querySelectorAll('.reveal-power-star,.power-star').forEach(s=>s.remove());score+=n;$('score').textContent=score;$('result').textContent=label;['correct','wrong'].forEach(x=>$(x).disabled=true)}
async function init(){try{let m=await api('/api/meta');if(!m.categories.length)throw Error('No categories found in database');render('cats',m.categories);render('diffs',m.difficulties);$('meta').textContent=m.count.toLocaleString()+' tossups loaded';}catch(e){$('meta').textContent='Filter loading error: '+e.message;$('cats').textContent='Could not load categories';$('diffs').textContent='Could not load difficulties'}}
function spawnPowerStars(){
 const b=$('correct');
 for(let n=0;n<7;n++){
  let s=document.createElement('span');s.className='power-star';s.textContent='✦';
  s.style.left=(8+Math.random()*78)+'%';s.style.top=(8+Math.random()*55)+'%';
  s.style.fontSize=(14+Math.random()*8)+'px';s.style.setProperty('--dx',(-18+Math.random()*36)+'px');
  s.style.animationDelay=(Math.random()*.10)+'s';b.appendChild(s);setTimeout(()=>s.remove(),900);
 }
}
$('start').onclick=read;$('pause').onclick=pauseResume;$('buzz').onclick=buzz;$('skip').onclick=load;$('new').onclick=load;$('check').onclick=()=>{if(!buzzed)return;reveal()};$('correct').onclick=()=>{const wasPower=powerBuzzed;mark(wasPower?15:10,wasPower?'Correct (Power): +15':'Correct: +10');if(wasPower)spawnPowerStars()};$('wrong').onclick=()=>{mark(lastLineBuzzed?0:-5,lastLineBuzzed?'Incorrect (Last line): 0':'Incorrect: -5')};
$('allc').onclick=()=>document.querySelectorAll('#cats input').forEach(x=>x.checked=true);$('nonec').onclick=()=>document.querySelectorAll('#cats input').forEach(x=>x.checked=false);$('alld').onclick=()=>document.querySelectorAll('#diffs input').forEach(x=>x.checked=true);$('noned').onclick=()=>document.querySelectorAll('#diffs input').forEach(x=>x.checked=false);$('reset').onclick=()=>{document.querySelectorAll('.checks input').forEach(x=>x.checked=true);$('search').value='';$('wpm').value=240;$('pitch').value=1;$('seconds').value=10;$('autotimer').checked=true};
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;if(e.code==='Space'){e.preventDefault();buzz()}if(e.key.toLowerCase()==='p'){pauseResume()}if(e.key.toLowerCase()==='n'){load()}});
function voiceset(){voices=window.speechSynthesis.getVoices()||[];$('voice').innerHTML=voices.map((v,n)=>`<option value="${n}">${v.name} (${v.lang})</option>`).join('')}
if('speechSynthesis' in window){voiceset();window.speechSynthesis.onvoiceschanged=voiceset}
if($('qbstyle'))$('qbstyle').onchange=()=>{speechResumeWord=0; speechPaused=false; qbStyleShown=0; if(cur)show(cur.question)};
init();

if($('tournament')) $('tournament').onchange=()=>{
  if($('tournament').checked){
    $('q').textContent='';
    if($('tournamentNotice')) $('tournamentNotice').style.display='block';
  } else {
    if($('tournamentNotice')) $('tournamentNotice').style.display='none';
    if(cur) show(cur.question);
  }
};
</script>
